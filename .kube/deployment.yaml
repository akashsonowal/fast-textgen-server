apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama2-server
  labels:
    app: llama2-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llama2-server
  template:
    metadata:
      labels:
        app: llama2-server
    spec:
      containers:
      - name: llama2-server
        image: llama2-server:v1
        ports:
        - containerPort: 80